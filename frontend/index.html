<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolBoi_2007 v3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button id="newChatBtn" class="new-chat-btn">
                <span>+ New Chat</span>
            </button>
        </div>
        
        <div class="conversations-list">
            <div id="conversationsList" class="conversations"></div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🤖 CoolBoi_2007 v3</h1>
                <p class="subtitle">Your AI Assistant</p>
                <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat" class="chat-messages"></div>
            
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="message" 
                        placeholder="Ask CoolBoi something... or type / for commands" 
                        autocomplete="off"
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" class="send-btn">
                        <span>Send</span>
                        <span class="icon">→</span>
                    </button>
                    <button id="uploadBtn" class="upload-btn" title="Upload File">📁</button>
                    <input type="file" id="fileInput" style="display:none;" />
                </div>
                <div id="commandSuggestions" class="command-suggestions"></div>
                <div id="error" class="error-message"></div>
            </div>
        </main>
    </div>
</div>

<!-- Settings Panel -->
<div id="settingsPanel" class="settings-panel">
    <div class="settings-header">
        <h2>⚙️ Settings</h2>
        <button id="closeSettingsBtn" class="settings-close-btn" title="Close">✕</button>
    </div>
    
    <div class="settings-content">
        <!-- Appearance Section -->
        <div class="settings-section">
            <h3 class="section-title">🎨 Appearance</h3>
            <button id="toggleThemeBtn" class="settings-action-btn">
                <span>🌙 Toggle Dark/Light Mode</span>
            </button>
        </div>
        
        <!-- Data Section -->
        <div class="settings-section">
            <h3 class="section-title">🗑️ Data</h3>
            <button id="clearHistoryBtn" class="settings-action-btn danger-btn">
                <span>📋 Clear Conversation History</span>
            </button>
        </div>
        
        <!-- Information Section -->
        <div class="settings-section">
            <h3 class="section-title">ℹ️ Information</h3>
            <div class="info-display">
                <div class="info-item">
                    <label>🤖 Model:</label>
                    <div id="modelInfo" class="info-value">Loading...</div>
                </div>
                <div class="info-item">
                    <label>💬 System Prompt:</label>
                    <div id="systemInfo" class="info-value">Loading...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
