<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolBoi_2007 v3</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-mode="default">

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button id="newChatBtn" class="new-chat-btn">
                <span>+ New Chat</span>
            </button>
        </div>
        
        <div class="conversations-list">
            <div id="conversationsList" class="conversations"></div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="mode-indicator" id="modeIndicator">
                    <span class="mode-icon">✦</span>
                    <span class="mode-text">MIXED MODE</span>
                </div>
                <h1>CoolBoi_2007 v3</h1>
                <p class="subtitle">Your AI Assistant</p>
                <button id="settingsBtn" class="settings-btn" title="Settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Mode Switcher -->
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="default" title="Mixed Mode - Gen-Z Gaming + Coding">
                    <span class="mode-btn-icon">✦</span>
                    <span class="mode-btn-label">MIXED</span>
                </button>
                <button class="mode-btn" data-mode="gaming" title="Gaming Mode - Full Gamer">
                    <span class="mode-btn-icon">⚔️</span>
                    <span class="mode-btn-label">GAMING</span>
                </button>
                <button class="mode-btn" data-mode="coding" title="Coding Mode - Dev Focused">
                    <span class="mode-btn-icon">&lt;/&gt;</span>
                    <span class="mode-btn-label">CODING</span>
                </button>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat" class="chat-messages"></div>
            
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="message" 
                        placeholder="Ask CoolBoi something... or type / for commands" 
                        autocomplete="off"
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" class="send-btn">
                        <span>Send</span>
                        <span class="icon">→</span>
                    </button>
                    <button id="uploadBtn" class="upload-btn" title="Upload File">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" style="display:none;" />
                </div>
                <div id="commandSuggestions" class="command-suggestions"></div>
                <div id="error" class="error-message"></div>
            </div>
        </main>
    </div>
</div>

<!-- Settings Sidebar -->
<div id="settingsSidebar" class="settings-sidebar">
    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-panel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button id="closeSettingsBtn" class="settings-close-btn" title="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <div class="settings-content">
            <!-- Mode Section -->
            <div class="settings-section">
                <h3 class="section-title">Current Mode</h3>
                <div class="current-mode-display" id="currentModeDisplay">
                    <span class="current-mode-icon">✦</span>
                    <span class="current-mode-text">Mixed Mode</span>
                </div>
            </div>

            <!-- Temperature Section -->
            <div class="settings-section">
                <h3 class="section-title">Temperature</h3>
                <div class="slider-container">
                    <input type="range" id="temperatureSlider" class="temperature-slider" min="0" max="1" step="0.1" value="0.7">
                    <div class="slider-value" id="temperatureValue">0.7</div>
                </div>
                <p class="slider-hint">Lower = focused, Higher = creative</p>
            </div>

            <!-- Theme Section -->
            <div class="settings-section">
                <h3 class="section-title">Theme</h3>
                <div class="theme-toggle">
                    <button id="themeDarkBtn" class="theme-btn active">
                        <span class="theme-icon">🌙</span>
                        <span>Dark</span>
                    </button>
                    <button id="themeLightBtn" class="theme-btn">
                        <span class="theme-icon">☀️</span>
                        <span>Light</span>
                    </button>
                </div>
            </div>

            <!-- Export Section -->
            <div class="settings-section">
                <h3 class="section-title">Export Chat</h3>
                <div class="export-buttons">
                    <button id="exportMdBtn" class="settings-action-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <span>Export as .md</span>
                    </button>
                    <button id="exportTxtBtn" class="settings-action-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                        <span>Export as .txt</span>
                    </button>
                </div>
            </div>

            <!-- Danger Zone -->
            <div class="settings-section">
                <h3 class="section-title danger-title">Danger Zone</h3>
                <button id="clearHistoryBtn" class="settings-action-btn danger-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Clear All History</span>
                </button>
            </div>

            <!-- Info Section -->
            <div class="settings-section info-section">
                <h3 class="section-title">System Info</h3>
                <div class="info-display">
                    <div class="info-item">
                        <label>Model</label>
                        <div id="modelInfo" class="info-value">Loading...</div>
                    </div>
                    <div class="info-item">
                        <label>Temperature</label>
                        <div id="tempInfo" class="info-value">0.7</div>
                    </div>
                </div>
            </div>

            <!-- Creator Section -->
            <div class="settings-section creator-section">
                <div class="creator-display">
                    <span class="creator-label">Created by</span>
                    <span class="creator-name">Anmol Bhardwaj</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
