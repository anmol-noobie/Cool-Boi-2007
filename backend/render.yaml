services:
  - type: web
    name: coolboi-2007
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        value: "https://your-site.onrender.com"
      - key: PYTHON_VERSION
        value: 3.12
